<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Remedy — Pre-launch</title>
<link rel="icon" type="image/png" href="/assets/favicon.png?v=113584ba">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v=0bc49f33">
<link rel="manifest" href="/marketing.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pre-launch">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F6EDE0">
<style>
  :root {
    --bg: #F6EDE0;
    --bg-deep: #EFE5D7;
    --card: #FFFDF9;
    --card-2: #FFFFFF;
    --line: #E5D8C6;
    --line-strong: #BFAE92;
    --ink: #1C1C1E;
    --muted: #55524F;
    --dim: #6A635E;
    --ice: #3E6B4E;
    --ice-mid: #5B8A6C;
    --ice-soft: #E7EFE9;
    --ice-deep: #234032;
    --shadow: 0 1px 0 rgba(255,255,255,0.9) inset, 0 12px 28px rgba(35, 64, 50, 0.06);
    --lime: var(--ice);
    --lime-ink: #FFFDF9;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--bg); }
  body {
    margin: 0;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    line-height: 1.35;
    -webkit-font-smoothing: antialiased;
    color-scheme: light;
    background:
      radial-gradient(900px 420px at 0% -10%, #FFFDF9 0%, transparent 55%),
      linear-gradient(180deg, #F9F3EA 0%, #F6EDE0 42%, #E5D8C6 100%);
    min-height: 100vh;
  }
  button, input, textarea { font: inherit; color: inherit; }
  button { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  .col { max-width: 1120px; margin: 0 auto; }
  header {
    position: sticky; top: 0; z-index: 5;
    background: rgba(249, 243, 234, 0.9);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid rgba(35, 64, 50, 0.08);
    padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 0;
  }
  .top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
  .brand {
    margin: 0; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--lime); font-weight: 700;
  }
  h1 { margin: 2px 0 0; font-size: 22px; font-weight: 700; letter-spacing: -0.04em; }
  .tools { display: flex; gap: 8px; align-items: center; }
  .iconbtn, .menu summary {
    width: 40px; height: 40px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--card-2);
    box-shadow: 0 1px 0 rgba(255,255,255,0.8) inset;
    display: grid; place-items: center; cursor: pointer; color: var(--ink);
    list-style: none;
  }
  .menu { position: relative; }
  .menu summary { list-style: none; }
  .menu summary::-webkit-details-marker { display: none; }
  .menu-pop {
    position: absolute; right: 0; top: 46px; width: 160px;
    background: var(--card-2); border: 1px solid var(--line); border-radius: 14px;
    padding: 6px; display: grid; gap: 4px;
    box-shadow: 0 16px 40px rgba(35, 64, 50, 0.12);
  }
  .menu-pop button, .menu-pop a {
    display: block; text-align: left; text-decoration: none;
    background: transparent; border: 0; color: var(--ink);
    border-radius: 10px; padding: 10px 12px; cursor: pointer; font-size: 14px;
  }
  .menu-pop button:hover, .menu-pop a:hover { background: var(--ice-soft); }
  .sync { margin: 8px 0 0; min-height: 16px; color: var(--dim); font-size: 12px; }
  .tabs { display: flex; gap: 6px; padding: 10px 0 12px; overflow-x: auto; }
  .tab { flex: 0 0 auto; }
  .tab {
    border: 0; background: transparent; color: var(--muted);
    border-radius: 999px; padding: 8px 14px; font-size: 14px; font-weight: 700; cursor: pointer;
  }
  .tab.on { background: var(--ice-deep); color: #FFFDF9; }
  main { padding: 20px 20px 140px; }
  .stage { display: block; }
  .hero {
    background: linear-gradient(180deg, #FFFFFF 0%, var(--card) 100%);
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 18px 16px 16px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }
  .hero-top { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
  .kicker {
    margin: 0; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--muted); font-weight: 700;
  }
  .hero h2 {
    margin: 4px 0 0; font-size: 40px; line-height: 0.95; letter-spacing: -0.05em; font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  .lead { margin: 8px 0 0; color: var(--muted); font-size: 14px; }
  .vs { margin: 4px 0 0; color: var(--ice); font-size: 13px; font-weight: 700; min-height: 0; }
  .hero.won {
    background: linear-gradient(165deg, #FFFDF9 0%, #E7EFE9 55%, #E7EFE9 100%);
    border-color: var(--ice);
    box-shadow: 0 18px 40px rgba(35, 64, 50, 0.12);
  }
  .vs:empty { display: none; }
  .ring-wrap { position: relative; width: 108px; height: 108px; flex: 0 0 auto; }
  .ring { width: 108px; height: 108px; display: block; }
  .ring .track { fill: none; stroke: #E5D8C6; stroke-width: 8; }
  .ring .value {
    fill: none; stroke: var(--ice); stroke-width: 8; stroke-linecap: round;
    stroke-dasharray: 326.7; stroke-dashoffset: 326.7;
    transform: rotate(-90deg); transform-origin: 60px 60px;
    transition: stroke-dashoffset 0.7s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .ring-label {
    position: absolute; inset: 0; display: grid; place-items: center; align-content: center;
    text-align: center;
  }
  .ring-label b {
    font-size: 28px; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; line-height: 1;
  }
  .ring-label span { display: block; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-top: 2px; }
  .lit b { color: var(--ice-deep); }
  .xp-row { display: flex; justify-content: space-between; gap: 8px; margin-top: 14px; font-size: 13px; font-weight: 700; }
  .xp-row span:last-child { color: var(--ice); font-variant-numeric: tabular-nums; }
  .bar { height: 8px; border-radius: 99px; background: var(--bg-deep); margin-top: 8px; overflow: hidden; }
  .bar i {
    display: block; height: 100%; width: 0; border-radius: 99px;
    background: linear-gradient(90deg, #BFAE92, var(--ice));
    transition: width 0.65s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .xp-next { margin: 6px 0 0; color: var(--dim); font-size: 12px; }
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 18px; }
  .week i {
    display: block; text-align: center; font-style: normal; font-size: 10px; color: var(--dim);
    background: var(--card-2); border: 1px solid var(--line); border-radius: 12px; padding: 8px 0 7px;
    box-shadow: 0 1px 0 rgba(255,255,255,0.8) inset;
    font-variant-numeric: tabular-nums;
  }
  .week i em { display: block; font-style: normal; font-size: 12px; font-weight: 800; color: var(--ink); margin-bottom: 2px; }
  .week i.on { border-color: var(--ice-mid); background: var(--ice-soft); }
  .week i.hot { background: var(--ice); border-color: var(--ice-deep); color: #FFFDF9; }
  .week i.hot em { color: #FFFDF9; }
  .week i.today { box-shadow: inset 0 0 0 1px var(--ink); }
  .week i.empty { opacity: 0.4; }
  .lane { margin-bottom: 22px; }
  .lane-h { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; margin-bottom: 8px; }
  .lane-h h3 { margin: 2px 0 0; font-size: 20px; letter-spacing: -0.03em; }
  .lane-h .frac { font-size: 18px; font-variant-numeric: tabular-nums; letter-spacing: -0.03em; }
  .lane-t1 .kicker, .lane-t1 .frac { color: var(--ice-deep); }
  .lane-t2 .kicker, .lane-t2 .frac { color: var(--ice); }
  .lane-t3 .kicker, .lane-t3 .frac { color: #2F5440; }
  .hint { margin: 3px 0 0; color: var(--muted); font-size: 13px; }
  .lane-bar { height: 4px; border-radius: 99px; background: var(--bg-deep); margin-bottom: 10px; overflow: hidden; }
  .lane-bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #BFAE92, var(--ice)); transition: width 0.65s cubic-bezier(0.22, 1, 0.36, 1); }
  .qblock {
    margin-bottom: 8px; scroll-margin-bottom: 130px;
    background: var(--card-2);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 12px 12px 14px;
    box-shadow: var(--shadow);
  }
  .qblock.board { overflow: hidden; }
  .qhead { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .qlabel { font-size: 16px; font-weight: 700; letter-spacing: -0.02em; }
  .qmeta { color: var(--dim); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
  .qmeta.on { color: var(--ice-deep); }
  .scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 10px; }
  .pip {
    height: 34px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg-deep); cursor: pointer; padding: 0;
    transition: background-color 0.35s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.35s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .pip.on { background: #D9CBB4; border-color: #BFAE92; }
  .pip.top { background: var(--ice); border-color: var(--ice-deep); }
  .result {
    margin-top: 8px; padding: 14px; border-radius: 16px;
    background: var(--card); border: 1px dashed var(--line-strong);
  }
  .result h3 { margin: 2px 0 0; font-size: 16px; font-weight: 700; }
  .under, .composer, .board-body { padding: 10px 0 0; }
  .logbtn, .addbtn, .savebtn, .x { border: 0; cursor: pointer; border-radius: 999px; }
  .logbtn, .savebtn, .addbtn {
    background: var(--ice); color: #FFFDF9; font-weight: 800; font-size: 13px; padding: 8px 12px;
  }
  .logbtn[hidden], .composer[hidden] { display: none; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chips:empty { display: none; }
  .chip {
    display: inline-flex; align-items: center; gap: 4px; max-width: 100%;
    background: var(--ice-soft); border-radius: 999px; padding: 4px 4px 4px 10px;
    font-size: 12px; font-weight: 700;
  }
  .chip a, .chip span { color: var(--ink); text-decoration: none; font-weight: 700; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .x {
    width: 22px; height: 22px; background: transparent; color: var(--muted); font-size: 16px; line-height: 1;
  }
  .composer { display: grid; gap: 8px; }
  .composer[hidden] { display: none; }
  input[type="text"], input[type="url"], textarea {
    width: 100%; background: #F9F3EA; border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 12px; font-size: 16px; color: var(--ink);
  }
  textarea { min-height: 84px; resize: vertical; line-height: 1.45; }
  .addbar { display: flex; gap: 8px; }
  .addbar input { flex: 1; min-width: 0; }
  .person, .fmt {
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    padding: 10px 0; border-top: 1px solid var(--line);
  }
  .who { flex: 1 1 140px; min-width: 120px; }
  .who a, .who b { display: block; color: var(--ink); text-decoration: none; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .who a { font-weight: 700; }
  .person > input, .fmt > input { width: auto; flex: 1 1 160px; min-width: 140px; padding: 8px 10px; font-size: 16px; }
  .empty {
    margin: 4px 0 10px; color: var(--dim); font-size: 13px;
  }
  .note-card {
    background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px;
  }
  .note-card h3 { margin: 0 0 8px; font-size: 16px; }
  .lockslot {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
    padding: 22px 16px calc(12px + env(safe-area-inset-bottom, 0px));
    background: linear-gradient(to top, #EFE5D7 64%, rgba(239,229,215,0));
    pointer-events: none;
  }
  .lockslot button {
    pointer-events: auto;
    display: block;
    width: min(1120px, 100%);
    margin: 0 auto;
    border-radius: 16px; cursor: pointer;
    background: var(--bg-deep); color: var(--ink);
    font-size: 16px; font-weight: 800; letter-spacing: -0.02em;
    padding: 16px; min-height: 56px;
    border: 1px solid var(--line);
  }
  .lockslot button.ready {
    background: var(--ice); color: #FFFDF9; border-color: var(--ice-deep);
    box-shadow: 0 10px 28px rgba(62, 107, 78, 0.22);
  }
  .lockslot button.on { background: var(--card-2); color: var(--muted); border: 1px solid var(--line); box-shadow: none; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .stat {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px;
  }
  .stat b { display: block; font-size: 28px; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 18px;
    padding: 14px; margin-bottom: 12px;
  }
  .card h3 { margin: 0 0 10px; font-size: 16px; }
  .heat { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .heat b { display: block; aspect-ratio: 1; border-radius: 4px; background: #E5D8C6; }
  .heat b.l1 { background: #D9CBB4; }
  .heat b.l2 { background: #8FB09A; }
  .heat b.l3 { background: #5B8A6C; }
  .heat b.l4 { background: #3E6B4E; }
  .heat b.today { outline: 2px solid var(--ink); outline-offset: 1px; }
  .habit { margin: 0 0 12px; }
  .habit .row { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 4px; }
  .habit .track { height: 6px; border-radius: 99px; background: var(--bg-deep); overflow: hidden; }
  .habit .track i { display: block; height: 100%; background: var(--ice); }
  .logline { padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .logline span { display: block; color: var(--dim); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 2px; }
  .logline a { color: var(--ink); font-weight: 680; text-decoration: none; }
  .toast {
    position: fixed; left: 50%; bottom: 96px; z-index: 25;
    transform: translateX(-50%) translateY(8px);
    background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 999px;
    font-size: 13px; font-weight: 700; opacity: 0; pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .pulse { animation: numpop 0.6s cubic-bezier(0.22, 1, 0.36, 1); }
  @keyframes numpop { 40% { transform: scale(1.04); } }
  .hidden { display: none !important; }
  .notes { max-width: 720px; }
  .notes-title { margin: 4px 0 14px; font-size: 28px; letter-spacing: -0.04em; font-weight: 700; }
  .daynote {
    background: var(--card-2);
    border: 1px solid var(--line);
    border-radius: 18px;
    margin: 0 0 14px;
    box-shadow: var(--shadow);
  }
  .daynote-h {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 12px;
    padding: 16px 16px 0;
  }
  .daynote-h h3 { margin: 2px 0 0; font-size: 22px; letter-spacing: -0.03em; }
  .daynote-h em {
    font-style: normal; font-size: 12px; font-weight: 700;
    color: var(--ice-deep); background: var(--ice-soft); border-radius: 999px; padding: 4px 8px;
  }
  .daynote-b { padding: 12px 16px 16px; }
  .field-label {
    display: block; margin: 0 0 6px;
    font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--muted); font-weight: 700;
  }
  .daynote-b textarea { width: 100%; min-height: 128px; margin: 0 0 16px; display: block; }
  .steps { list-style: none; margin: 0 0 12px; padding: 0; }
  .steps li {
    display: grid; grid-template-columns: 28px minmax(0, 1fr) 28px;
    align-items: center; gap: 8px; padding: 8px 0; border-top: 1px solid var(--line);
  }
  .steps li.done input { color: var(--dim); }
  .tick {
    width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line-strong);
    background: #fff; padding: 0; display: grid; place-items: center;
  }
  .tick.on { background: var(--ice); border-color: var(--ice-deep); }
  .tick.on::after {
    content: ""; width: 5px; height: 9px; border: solid #FFFDF9; border-width: 0 2px 2px 0;
    transform: rotate(45deg) translate(-1px, -2px);
  }
  .steps input { width: 100%; min-width: 0; padding: 8px 10px; }
  .daynote-b .addbar { margin: 0; }
  .library { max-width: 880px; }
  .tpl textarea { min-height: 220px; line-height: 1.5; }
  .dmbox { margin-top: 18px; }
  .dmbox .hint { margin: 2px 0 8px; }
  .dmbox textarea { min-height: 110px; margin: 0; }
  .dmbox .row { margin-top: 8px; }
  .rec-main .hint, .clist .hint { white-space: normal; overflow: visible; }
  .clist {
    background: var(--card-2);
    border: 1px solid var(--line);
    border-radius: 16px;
    margin: 0 0 12px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .clist summary {
    list-style: none;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    cursor: pointer;
  }
  .clist summary::-webkit-details-marker { display: none; }
  .clist-title { flex: 1; font-size: 16px; font-weight: 700; }
  .clist-count {
    font-style: normal; font-size: 12px; font-weight: 700;
    color: var(--ice-deep); background: var(--ice-soft); border-radius: 999px; padding: 3px 8px;
  }
  .chev {
    width: 8px; height: 8px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted);
    transform: rotate(-45deg); flex: 0 0 auto;
  }
  .clist[open] .chev { transform: rotate(45deg); }
  .clist.medium { border-left: 4px solid #BFAE92; }
  .clist.large { border-left: 4px solid var(--ice); }
  .clist.huge { border-left: 4px solid var(--ice-deep); }
  .clist.ugc { border-left: 4px solid #8A7F70; }
  .clist.sent { border-left: 4px solid var(--line-strong); }
  .clist-body { padding: 0 16px 14px; }
  .avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--ice-soft); color: var(--ice-deep);
    display: grid; place-items: center; font-size: 12px; font-weight: 700; flex: 0 0 auto;
  }
  .clist.huge .avatar { background: var(--ice-deep); color: #FFFDF9; }
  .people { margin: 8px 0 0; padding: 0; list-style: none; }
  .person a.handle { color: var(--ink); text-decoration: none; font-weight: 700; font-size: 14px; }
  .person .note-in { flex: 1; min-width: 80px; padding: 7px 10px; font-size: 16px; }
  .rec { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-top: 1px solid var(--line); }
  .rec-main { flex: 1; min-width: 0; }
  .rec-meta { color: var(--muted); font-size: 12px; margin-left: 8px; font-weight: 700; }
  .rec-actions { display: flex; gap: 6px; flex: 0 0 auto; }
  .tpl { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 14px; }
  .tpl:first-child { border-top: 0; margin-top: 0; padding-top: 0; }
  .tpl-head { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
  .tpl-head input { flex: 1; min-width: 140px; font-weight: 700; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  button.ghost, .ghost {
    background: var(--card-2); color: var(--ink); border: 1px solid var(--line);
    border-radius: 999px; padding: 8px 12px; cursor: pointer; font-weight: 700; font-size: 13px;
  }
  button.soft, .soft {
    background: var(--ice-soft); color: var(--ice-deep); border: 0;
    border-radius: 999px; padding: 8px 12px; cursor: pointer; font-weight: 800; font-size: 13px;
  }
  button.danger, .danger {
    background: transparent; color: #8C3D32; border: 1px solid #E4C8C2;
    border-radius: 999px; padding: 8px 12px; cursor: pointer; font-size: 13px;
  }
  .copied { background: var(--ice-soft) !important; color: var(--ice-deep) !important; }
  .card h2 { margin: 0 0 8px; font-size: 18px; font-weight: 700; }
  .sharebox { background: linear-gradient(180deg, #F9F3EA, #fff); }
  @media (max-width: 640px) {
    .person { flex-wrap: wrap; }
    .person .note-in { flex: 1 1 100%; }
    .rec { flex-wrap: wrap; }
    .rec-actions { width: 100%; }
  }
  @media (min-width: 860px) {
    main { padding-bottom: 40px; }
    .stage { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 28px; align-items: start; }
    .stage-side { position: sticky; top: 88px; }
    .lockslot { position: static; background: none; padding: 0; pointer-events: auto; }
    .lockslot button { width: 100%; }

      { id: 'followers', label: 'DM followers' },
      { id: 'opinion', label: 'Opinion' },
      { id: 'cofounder', label: 'Co-founder' },
      { id: 'ugc', label: 'UGC' }
    ];
    tabs.innerHTML = tabList.map(function (t) {
      return '<button type="button" class="tab' + (view === t.id ? ' on' : '') + '" data-view="' + t.id + '">' + t.label + '</button>';
    }).join('');
    var pages = {
      today: todayHtml,
      notes: notesHtml,
      record: recordHtml,
      followers: followersHtml,
      opinion: function () { return libraryView('opinion', 'Opinion DMs', 'Want their take. Not a shout-out. Edit these. Add as many as you want. Copy dumps the text.'); },
      cofounder: function () { return libraryView('cofounder', 'Co-founder DMs', 'Looking for a PT co-founder. Not a shout-out. Edit these. Add as many as you want. Copy dumps the text.'); },
      ugc: function () { return libraryView('ugc', 'UGC DMs', 'Paid ask. Edit these. Add as many as you want. Copy dumps the text.'); }
    };
    app.innerHTML = (pages[view] || todayHtml)();
    muteToggle = false;
    if (!document.getElementById('sync').textContent) setSync('Saved');
    paint();
    if (keepScroll) {
      if (y) window.scrollTo(0, y);
    } else {
      window.scrollTo(0, 0);
    }
  }
  function setView(id) {
    if (VIEWS.indexOf(id) === -1) id = 'today';
    view = id;
    var hash = '#' + id;
    if (location.hash !== hash) history.replaceState(null, '', hash);
    openComposer = '';
    draw();
  }

  function addUgc(name, url, e) {
    name = String(name || '').trim().slice(0, 80);
    if (!name) { toast('Name it'); return; }
    if (state.ugcList.length >= 200) { toast('List is full'); return; }
    var prev = snapshot();
    state.ugcList.unshift({ id: uid(), name: name, url: cleanUrl(url), note: '', day: todayKey(), at: new Date().toISOString() });
    dayOf(todayKey());
    draw(true);
    celebrate(prev, e);
  }
  function parseLoose(text) {
    var raw = String(text || '').trim();
    var url = (raw.match(/https?:\/\/[^\s]+/i) || [''])[0];
    var handle = '';
    var ig = raw.match(/instagram\.com\/([A-Za-z0-9._]+)/i);
    var at = raw.match(/@([A-Za-z0-9._]{1,30})/);
    if (ig) handle = ig[1];
    else if (at) handle = at[1];
    var name = handle ? '@' + handle.replace(/^@/, '') : raw.replace(url, '').trim();
    if (!name) name = url ? url.replace(/^https?:\/\/(www\.)?/, '').slice(0, 60) : '';
    return { name: name.slice(0, 80), url: url };
  }
  function addUgcFromInput(e) {
    var input = app.querySelector('[data-ugc-input]');
    if (!input) return;
    var parsed = parseLoose(input.value);
    if (!parsed.name && parsed.url) parsed.name = parsed.url.slice(0, 80);
    addUgc(parsed.name, parsed.url || input.value, e);
  }
  function addFormat(title, e) {
    title = String(title || '').trim().slice(0, 140);
    if (!title) { toast('Name the format'); return; }
    if (state.formats.length >= 200) { toast('List is full'); return; }
    var prev = snapshot();
    state.formats.unshift({ id: uid(), title: title, note: '', url: '', day: todayKey(), at: new Date().toISOString() });
    dayOf(todayKey());
    draw(true);
    celebrate(prev, e);
  }
  function saveSource(quest, e) {
    var block = app.querySelector('[data-block="' + quest + '"]');
    if (!block) return;
    var titleEl = block.querySelector('[data-src-title]');
    var urlEl = block.querySelector('[data-src-url]');
    var title = titleEl ? titleEl.value.trim().slice(0, 140) : '';
    if (!title) { toast('Name it'); if (titleEl) titleEl.focus(); return; }
    if (state.sources.length >= 400) { toast('Log is full'); return; }
    var prev = snapshot();
    state.sources.unshift({
      id: uid(),
      quest: quest,
      title: title,
      url: cleanUrl(urlEl ? urlEl.value : ''),
      day: todayKey(),
      at: new Date().toISOString()
    });
    openComposer = '';
    draw(true);
    celebrate(prev, e);
  }
  function classifyShare(text) {
    var parsed = parseLoose(text);
    var low = (parsed.url || text || '').toLowerCase();
    if (/youtu\.be|youtube\.com/.test(low)) {
      return { kind: 'src', quest: 't1yt', title: parsed.name || 'YouTube', url: parsed.url };
    }
    if (/spotify\.com\/episode|podcasts\.apple\.com|overcast\.fm/.test(low)) {
      return { kind: 'src', quest: 't1pod', title: parsed.name || 'Podcast', url: parsed.url };
    }
    return { kind: 'ugc', name: parsed.name, url: parsed.url };
  }

  function handleAction(e) {
    var weight = e.target.closest('[data-weight]');
    if (weight) {
      var id = weight.getAttribute('data-weight');
      var n = Number(weight.getAttribute('data-n'));
      var row = dayOf(todayKey());
      var prev = snapshot();
      var was = depthOf(row, id);
      row[id] = was === n ? 0 : n;
      if (row[id] === 0 && openComposer === id) openComposer = '';
      celebrate(prev, e);
      return;
    }
    var openLog = e.target.closest('[data-open-log]');
    if (openLog) {
      openComposer = openLog.getAttribute('data-open-log');
      paint();
      var srcInput = app.querySelector('[data-block="' + openComposer + '"] [data-src-title]');
      if (srcInput) srcInput.focus();
      return;
    }
    var saveSrc = e.target.closest('[data-save-src]');
    if (saveSrc) { saveSource(saveSrc.getAttribute('data-save-src'), e); return; }
    var lock = e.target.closest('#lockDay');
    if (lock) {
      var day = dayOf(todayKey());
      if (!day.done && !showedUp(day)) { toast('Set a weight first'); return; }
      var before = snapshot();
      day.done = !day.done;
      celebrate(before, e);
      return;
    }
    var addU = e.target.closest('[data-add-ugc]');
    if (addU) { addUgcFromInput(e); return; }
    var addF = e.target.closest('[data-add-fmt]');
    if (addF) {
      var fmtInput = app.querySelector('[data-fmt-input]');
      addFormat(fmtInput ? fmtInput.value : '', e);
      return;
    }
    var saveDmsBtn = e.target.closest('[data-save-dms]');
    if (saveDmsBtn) { saveDms(); return; }
    var addTpl = e.target.closest('[data-add-tpl]');
    if (addTpl) {
      var kind = addTpl.getAttribute('data-add-tpl');
      if (kind !== 'opinion' && kind !== 'cofounder' && kind !== 'ugc') return;
      if (!Array.isArray(state[kind])) state[kind] = [];
      state[kind].push({ id: uid(), name: 'New DM', body: '', updatedAt: new Date().toISOString() });
      save();
      draw(true);
      return;
    }
    var delTpl = e.target.closest('[data-del-tpl]');
    if (delTpl) {
      var dk = delTpl.getAttribute('data-del-tpl');
      var did = delTpl.getAttribute('data-id');
      if ((dk !== 'opinion' && dk !== 'cofounder' && dk !== 'ugc') || !Array.isArray(state[dk]) || state[dk].length < 2) return;
      state[dk] = state[dk].filter(function (t) { return t.id !== did; });
      save();
      draw(true);
      return;
    }
    var copyFollower = e.target.closest('[data-copy-follower]');
    if (copyFollower) {
      var dmKey = copyFollower.getAttribute('data-copy-follower');
      var dmText = (state.followerDms && state.followerDms[dmKey]) || '';
      var copyBtn = copyFollower;
      function doneFollowerCopy() {
        copyBtn.textContent = 'Copied';
        copyBtn.classList.add('copied');
        setTimeout(function () { copyBtn.textContent = 'Copy'; copyBtn.classList.remove('copied'); }, 1200);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(dmText).then(doneFollowerCopy).catch(function () { doneFollowerCopy(); });
      } else doneFollowerCopy();
      return;
    }
    var copy = e.target.closest('[data-copy]');
    if (copy) {
      var tpl = findTpl(copy.getAttribute('data-copy'), copy.getAttribute('data-id'));
      if (!tpl) return;
      var btn = copy;
      function doneCopy() {
        btn.textContent = 'Copied';
        btn.classList.add('copied');
        setTimeout(function () { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1200);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(tpl.body).then(doneCopy).catch(function () { doneCopy(); });
      } else doneCopy();
      return;
    }
    var addCreator = e.target.closest('[data-add-creator]');
    if (addCreator) { addFromInput(addCreator.getAttribute('data-add-creator')); return; }
    var clip = e.target.closest('[data-clip]');
    if (clip) { addFromClipboard(clip.getAttribute('data-clip')); return; }
    var delCreator = e.target.closest('[data-del-creator]');
    if (delCreator) {
      var lk = delCreator.getAttribute('data-del-creator');
      var cid = delCreator.getAttribute('data-id');
      var removed = findCreator(lk, cid);
      state.creators[lk] = state.creators[lk].filter(function (c) { return c.id !== cid; });
      if (removed) {
        if (!state.removedCreators[lk]) state.removedCreators[lk] = {};
        state.removedCreators[lk][removed.handle] = new Date().toISOString();
      }
      save();
      draw(true);
      return;
    }
    var copyHandle = e.target.closest('[data-copy-handle]');
    if (copyHandle) {
      var person = findCreator(copyHandle.getAttribute('data-copy-handle'), copyHandle.getAttribute('data-id'));
      if (!person) return;
      var hb = copyHandle;
      function copiedH() {
        hb.textContent = 'Copied';
        hb.classList.add('copied');
        setTimeout(function () { hb.textContent = 'Copy'; hb.classList.remove('copied'); }, 1200);
      }
      var handleText = '@' + person.handle;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(handleText).then(copiedH).catch(function () { copiedH(); });
      } else copiedH();
      return;
    }
    var pick = e.target.closest('[data-pick-list]');
    if (pick && pendingShare) {
      var dest = pick.getAttribute('data-pick-list');
      var result = addHandles(dest, pendingShare.handles);
      pendingShare = null;
      setView(CREATOR_LISTS[dest].tab);
      reportAdd(dest, result);
      return;
    }
    var recBtn = e.target.closest('[data-rec]');
    if (recBtn) {
      var handle = recBtn.getAttribute('data-handle');
      var verdict = recBtn.getAttribute('data-rec');
      if (!handle || (verdict !== 'approve' && verdict !== 'reject')) return;
      state.recVerdicts[handle] = verdict;
      if (verdict === 'approve') {
        var rec = RECS.filter(function (r) { return r.handle === handle; })[0];
        if (rec) {
          var added = addHandles(rec.tier, [handle]);
          reportAdd(rec.tier, added);
          if (!added.added.length) save();
        } else save();
      } else save();
      draw(true);
      return;
    }
    var markSent = e.target.closest('[data-dm-sent]');
    if (markSent) {
      var sentPerson = findCreator(markSent.getAttribute('data-dm-sent'), markSent.getAttribute('data-id'));
      if (!sentPerson) return;
      sentPerson.dmSent = true;
      state.listsOpen['sent-' + CREATOR_LISTS[markSent.getAttribute('data-dm-sent')].tab] = true;
      save();
      draw(true);
      return;
    }
    var undoSent = e.target.closest('[data-dm-undo]');
    if (undoSent) {
      var backPerson = findCreator(undoSent.getAttribute('data-dm-undo'), undoSent.getAttribute('data-id'));
      if (!backPerson) return;
      backPerson.dmSent = false;
      save();
      draw(true);
      return;
    }
    var copyShare = e.target.closest('[data-copy-share]');
    if (copyShare) {
      var field = app.querySelector('.sharebox input');
      if (field && navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(field.value).then(function () { toast('Share link copied'); });
      }
      return;
    }
    var addStep = e.target.closest('[data-add-step]');
    if (addStep) { addStepFor(addStep.getAttribute('data-add-step'), e); return; }
    var togStep = e.target.closest('[data-step-toggle]');
    if (togStep) {
      var sk = togStep.getAttribute('data-step-toggle');
      var step = (state.steps[sk] || []).filter(function (s) { return s.id === togStep.getAttribute('data-id'); })[0];
      if (!step) return;
      step.done = !step.done;
      save();
      draw(true);
      return;
    }
    var delStep = e.target.closest('[data-del-step]');
    if (delStep) {
      var dk2 = delStep.getAttribute('data-del-step');
      state.steps[dk2] = (state.steps[dk2] || []).filter(function (s) { return s.id !== delStep.getAttribute('data-id'); });
      save();
      draw(true);
      return;
    }
    var delS = e.target.closest('[data-del-source]');
    if (delS) {
      var prevS = snapshot();
      var sid = delS.getAttribute('data-del-source');
      state.sources = state.sources.filter(function (s) { return s.id !== sid; });
      draw(true);
      celebrate(prevS, e);
      return;
    }
    var delU = e.target.closest('[data-del-ugc]');
    if (delU) {
      var prevU = snapshot();
      state.ugcList = state.ugcList.filter(function (u) { return u.id !== delU.getAttribute('data-del-ugc'); });
      draw(true);
      celebrate(prevU, e);
      return;
    }
    var delF = e.target.closest('[data-del-fmt]');
    if (delF) {
      var prevF = snapshot();
      state.formats = state.formats.filter(function (f) { return f.id !== delF.getAttribute('data-del-fmt'); });
      draw(true);
      celebrate(prevF, e);
      return;
    }
    var tab = e.target.closest('[data-view]');
    if (tab) setView(tab.getAttribute('data-view'));
  }

  function isField(e) {
    return Boolean(e.target.closest('input, textarea, select, a'));
  }
  function isTap(e) {
    return Boolean(e.target.closest('[data-weight], #lockDay, [data-open-log], [data-save-src], [data-add-ugc], [data-add-fmt], [data-del-source], [data-del-ugc], [data-del-fmt], [data-view], [data-save-dms], [data-add-tpl], [data-del-tpl], [data-copy], [data-copy-follower], [data-add-creator], [data-clip], [data-del-creator], [data-copy-handle], [data-pick-list], [data-copy-share], [data-rec], [data-dm-sent], [data-dm-undo], [data-add-step], [data-step-toggle], [data-del-step]'));
  }
  function onTouchEnd(e) {
    if (isField(e) || !isTap(e)) return;
    e.preventDefault();
    tapLock = Date.now() + 500;
    handleAction(e);
  }
  function onClick(e) {
    if (isField(e) || !isTap(e)) return;
    if (Date.now() < tapLock) { e.preventDefault(); return; }
    handleAction(e);
  }
  document.body.addEventListener('touchend', onTouchEnd, { passive: false });
  document.body.addEventListener('click', onClick);

  app.addEventListener('input', function (e) {
    var t = e.target;
    if (t.hasAttribute('data-note')) {
      dayOf(todayKey()).note = t.value;
      save();
      return;
    }
    if (t.hasAttribute('data-ugc-note')) {
      var u = state.ugcList.filter(function (item) { return item.id === t.getAttribute('data-ugc-note'); })[0];
      if (!u) return;
      u.note = t.value;
      save();
      return;
    }
    if (t.hasAttribute('data-fmt-note')) {
      var f = state.formats.filter(function (item) { return item.id === t.getAttribute('data-fmt-note'); })[0];
      if (!f) return;
      f.note = t.value;
      save();
      return;
    }
    if (t.hasAttribute('data-follower-dm')) {
      var dmId = t.getAttribute('data-follower-dm');
      if (FOLLOWER_DM_IDS.indexOf(dmId) === -1) return;
      if (!state.followerDms) state.followerDms = defaultFollowerDms();
      if (state.followerDms[dmId] === t.value) return;
      state.followerDms[dmId] = t.value.slice(0, 2000);
      save();
      return;
    }
    if (t.hasAttribute('data-tpl')) {
      var tpl = findTpl(t.getAttribute('data-tpl'), t.getAttribute('data-id'));
      var field = t.getAttribute('data-field');
      if (!tpl || (field !== 'name' && field !== 'body')) return;
      if (tpl[field] === t.value) return;
      tpl[field] = t.value;
      tpl.updatedAt = new Date().toISOString();
      save();
      return;
    }
    if (t.hasAttribute('data-creator-note')) {
      var person = findCreator(t.getAttribute('data-creator-note'), t.getAttribute('data-id'));
      if (!person) return;
      person.note = t.value;
      save();
      return;
    }
    if (t.hasAttribute('data-day-summary')) {
      dayOf(t.getAttribute('data-day-summary')).note = t.value;
      save();
      return;
    }
    if (t.hasAttribute('data-step-text')) {
      var list = state.steps[t.getAttribute('data-step-text')] || [];
      var step = list.filter(function (s) { return s.id === t.getAttribute('data-id'); })[0];
      if (!step) return;
      step.text = t.value;
      save();
    }
  });
  app.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    if (e.target.hasAttribute('data-ugc-input')) { e.preventDefault(); addUgcFromInput(e); }
    if (e.target.hasAttribute('data-fmt-input')) {
      e.preventDefault();
      addFormat(e.target.value, e);
    }
    var creatorInput = e.target.closest('[data-creator-input]');
    if (creatorInput) {
      e.preventDefault();
      addFromInput(creatorInput.getAttribute('data-creator-input'));
    }
    if (e.target.hasAttribute('data-step-input')) {
      e.preventDefault();
      addStepFor(e.target.getAttribute('data-step-input'));
    }
    if (e.target.hasAttribute('data-src-title') || e.target.hasAttribute('data-src-url')) {
      e.preventDefault();
      var block = e.target.closest('[data-block]');
      if (block) saveSource(block.getAttribute('data-block'), e);
    }
  });

  app.addEventListener('toggle', function (e) {
    if (muteToggle || !boardReady) return;
    var el = e.target;
    if (!el || !el.getAttribute) return;
    if (el.hasAttribute('data-clist')) {
      state.listsOpen[el.getAttribute('data-clist')] = el.open;
      save();
      return;
    }
    if (!el.hasAttribute('data-rlist')) return;
    state.recsOpen[el.getAttribute('data-rlist')] = el.open;
    save();
  }, true);

  document.getElementById('muteBtn').addEventListener('click', function () {
    soundOn = !soundOn;
    localStorage.setItem(SOUND_KEY, soundOn ? '1' : '0');
    paintMute();
    if (soundOn) chord('hit');
  });
  document.getElementById('exportBtn').onclick = function () {
    var blob = new Blob([JSON.stringify(payload(), null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'remedy-prelaunch.json';
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1500);
  };
  document.getElementById('importBtn').onclick = function () {
    document.getElementById('importFile').click();
  };
  document.getElementById('importFile').onchange = function (e) {
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var next = JSON.parse(String(reader.result || ''));
        if (!next || next.epoch !== EPOCH) throw new Error('bad');
        state = hydrate(next);
        save();
        draw();
        toast('Imported');
      } catch (err) {
        alert('That file is not a pre-launch export.');
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  };

  function readIncoming() {
    var q = new URLSearchParams(location.search);
    var chunks = [q.get('add'), q.get('text'), q.get('url'), q.get('title')].filter(Boolean);
    if (!chunks.length) return '';
    if (location.search) history.replaceState(null, '', location.pathname + (location.hash || ''));
    return chunks.join('\n');
  }
  function applyIncoming(text) {
    if (!text) return;
    var handles = parseHandles(text);
    if (handles.length && /instagram\.com|instagr\.am|ig\.me|@/i.test(text)) {
      pendingShare = { handles: handles };
      setView('opinion');
      toast('Pick a list for @' + handles.join(' @'));
      return;
    }
    var item = classifyShare(text);
    var fake = { clientX: window.innerWidth / 2, clientY: 160 };
    if (item.kind === 'src') {
      var prev = snapshot();
      state.sources.unshift({
        id: uid(), quest: item.quest, title: item.title || 'Saved', url: cleanUrl(item.url),
        day: todayKey(), at: new Date().toISOString()
      });
      var row = dayOf(todayKey());
      if (!depthOf(row, item.quest)) row[item.quest] = 1;
      setView('today');
      celebrate(prev, fake);
      toast('Logged under Meta ads');
      return;
    }
    if (!item.name) { toast('Nothing to add'); return; }
    addUgc(item.name, item.url, fake);
    toast('Added to the UGC list');
  }

  window.addEventListener('pagehide', function () {
    if (!boardReady) return;
    syncOpenTpls();
    if (!pushTimer && Date.now() - dirtyAt > 8000) return;
    clearTimeout(pushTimer);
    pushTimer = null;
    persistLocal();
    pushRemote(true);
  });

  paintMute();
  draw();
  var incoming = readIncoming();
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  pullRemote().then(function (result) {
    if (result === 'applied') draw();
    boardReady = true;
    if (pendingSave) save();
    applyIncoming(incoming);
  });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') refreshSharedLists();
  });
  if (location.hostname === 'marketing.remedyrecoveries.com' && 'serviceWorker' in navigator) {
    navigator.serviceWorker.register('/marketing-sw.js').catch(function () {});
  }
})();
</script>
</body>
</html>
